<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <filter id="red-shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#e03131" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 1.5 L 7.5 4.5 L 0 7.5 Z" fill="#495057" />
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 1.5 L 7.5 4.5 L 0 7.5 Z" fill="#e03131" />
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; fill: #1e1e1e; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 500; fill: #495057; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 700; font-size: 19px; }
      .card-sub { font-family: "SF Mono", "Consolas", Menlo, monospace; font-size: 13px; fill: #868e96; }
      .card-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 14.5px; fill: #2b2b2b; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: 600; fill: #495057; text-anchor: middle; }
      .cfg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: 700; fill: #c92a2a; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>

  <g transform="translate(620, 50)" text-anchor="middle">
    <text class="title" font-size="30" y="0">雯宝现行完整流程</text>
    <text class="subtitle" font-size="16" y="32">玩家路径、闯关结算、抽卡、密语、资源，全部在浏览器内闭环</text>
  </g>

  <!-- 卡片 -->
  
    <g transform="translate(40, 120)" filter="url(#shadow)">
      <rect width="360" height="250" rx="14" fill="#ebfbee" stroke="#0ca678" stroke-width="2"/>
      <text class="card-title" x="180" y="36" text-anchor="middle" fill="#0ca678">A 进游戏</text>
      <text class="card-sub" x="180" y="56" text-anchor="middle">title → lobby</text>
      <line x1="25" y1="72" x2="335" y2="72" stroke="#b2f2bb" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 点封面进入主大厅</text>
        <text y="28">• 底栏：大厅 / 衣橱 / 闯关</text>
        <text y="56">• 幻阁 / 图鉴</text>
        <text y="84">• 大厅按钮另开骨骼工坊</text>
      </g>
    </g>

    <g transform="translate(440, 120)" filter="url(#shadow)">
      <rect width="360" height="250" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
      <text class="card-title" x="180" y="36" text-anchor="middle" fill="#1971c2">B 换装</text>
      <text class="card-sub" x="180" y="56" text-anchor="middle">wardrobe · rig</text>
      <line x1="25" y1="72" x2="335" y2="72" stroke="#a5d8ff" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 选槽位，穿上已解锁单品</text>
        <text y="28">• 礼券升星：费用 = 当前星 × 8</text>
        <text y="56">• 每星全属性 +15%，上限 ★5</text>
        <text y="84">• 骨骼工坊拖关节，写入 dressSkeletons</text>
      </g>
    </g>

    <g transform="translate(840, 120)" filter="url(#shadow)">
      <rect width="360" height="250" rx="14" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
      <text class="card-title" x="180" y="36" text-anchor="middle" fill="#7048e8">C 闯关</text>
      <text class="card-sub" x="180" y="56" text-anchor="middle">evaluateOutfitForStage</text>
      <line x1="25" y1="72" x2="335" y2="72" stroke="#d0bfff" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 可一键推荐已解锁最优搭配</text>
        <text y="28">• 携带最多 2 个舞台技能</text>
        <text y="56">• 加权 + 羁绊卡 + 技能 + 套装</text>
        <text y="84">• 评级 C/B/A/S/SS/SSS，发礼券</text>
      </g>
    </g>

    <g transform="translate(840, 470)" filter="url(#shadow)">
      <rect width="360" height="250" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
      <text class="card-title" x="180" y="36" text-anchor="middle" fill="#e8590c">F 密语</text>
      <text class="card-sub" x="180" y="56" text-anchor="middle">sendCompanionChatMessage</text>
      <line x1="25" y1="72" x2="335" y2="72" stroke="#ffc078" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 页面在，当前导航到不了</text>
        <text y="28">• POST companion-scene mode=chat</text>
        <text y="56">• Ollama 成功则用模型回复</text>
        <text y="84">• 超时或失败用本地回退句</text>
      </g>
    </g>

    <g transform="translate(440, 470)" filter="url(#shadow)">
      <rect width="360" height="250" rx="14" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
      <text class="card-title" x="180" y="36" text-anchor="middle" fill="#7048e8">E 抽卡与重绘</text>
      <text class="card-sub" x="180" y="56" text-anchor="middle">pavilion</text>
      <line x1="25" y1="72" x2="335" y2="72" stroke="#d0bfff" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 单抽 5 礼券，五连 20 礼券</text>
        <text y="28">• 五连第 5 抽保底 SR 或 SSR</text>
        <text y="56">• 重复单品自动升星</text>
        <text y="84">• AI 重绘走 /api/comfy/draw 再抠图</text>
      </g>
    </g>

    <g transform="translate(40, 470)" filter="url(#shadow)">
      <rect width="360" height="250" rx="14" fill="#ebfbee" stroke="#0ca678" stroke-width="2"/>
      <text class="card-title" x="180" y="36" text-anchor="middle" fill="#0ca678">D 写档</text>
      <text class="card-sub" x="180" y="56" text-anchor="middle">两把钥匙分开</text>
      <line x1="25" y1="72" x2="335" y2="72" stroke="#b2f2bb" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 穿戴、星级、通关、礼券、自定义图 → v8</text>
        <text y="28">• 摸摸头 / 闯关 / 抽卡 → companionAct</text>
        <text y="56">• bond 与皮肤写入世界档 v2</text>
        <text y="84">• 世界档约 120ms 防抖保存</text>
      </g>
    </g>

  <!-- 连线与标签 -->
  
    <g>
      <path d="M 400 245 L 440 245" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
      <rect x="374" y="200" width="60" height="22" rx="4" fill="#f1f3f5" />
      <text class="tag-text" x="404" y="214" text-anchor="middle">去换装</text>
    </g>

    <g>
      <path d="M 800 245 L 840 245" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
      <rect x="774" y="200" width="60" height="22" rx="4" fill="#f1f3f5" />
      <text class="tag-text" x="804" y="214" text-anchor="middle">去评分</text>
    </g>

    <g>
      <path d="M 1020 370 L 1020 470" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
      <rect x="1000" y="386" width="60" height="22" rx="4" fill="#f1f3f5" />
      <text class="tag-text" x="1030" y="400" text-anchor="middle">结算后可聊</text>
    </g>

    <g>
      <path d="M 840 595 L 800 595" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
      <rect x="730" y="554" width="60" height="22" rx="4" fill="#f1f3f5" />
      <text class="tag-text" x="760" y="568" text-anchor="middle">幻阁补给</text>
    </g>

    <g>
      <path d="M 440 595 L 400 595" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
      <rect x="330" y="554" width="60" height="22" rx="4" fill="#f1f3f5" />
      <text class="tag-text" x="360" y="568" text-anchor="middle">结果落盘</text>
    </g>

    <g>
      <path d="M 220 470 L 220 370" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
      <rect x="200" y="386" width="60" height="22" rx="4" fill="#f1f3f5" />
      <text class="tag-text" x="230" y="400" text-anchor="middle">下次打开读回</text>
    </g>

  <!-- 配置驱动底框 -->
  
    <g transform="translate(40, 760)" filter="url(#red-shadow)">
      <rect width="1160" height="170" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2.5"/>
      <text class="card-title" x="580" y="36" text-anchor="middle" fill="#c92a2a" font-size="22">闯关分数怎么加总</text>
      <text class="card-sub" x="580" y="58" text-anchor="middle" font-size="14">nikki-wardrobe.ts evaluateOutfitForStage</text>
      <line x1="30" y1="74" x2="1130" y2="74" stroke="#ffc9c9" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(35, 104)" font-size="15">
        <text y="0">• 五槽属性 × 星级倍率 → 再乘章节权重。羁绊卡按被动属性加成；两项主动技能；同套 ≥3 件给 40% / 4 件 65% / 5 件 100% 套装分</text>
        <text y="28">• 对照 sScore 定级。首次达到 S/SS/SSS 且章节配了 firstSRewardItem 时解锁该单品。未达 S 仍发一半礼券（至少 3）</text>
      </g>
    </g>
</svg>